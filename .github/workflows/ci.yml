name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sequana
          POSTGRES_USER: sequana
          POSTGRES_PASSWORD: sequana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sequana -d sequana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        working-directory: backend

      - name: Backend smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgres://sequana:sequana@localhost:5432/sequana
          SEQUANA_CREDENTIAL_KEY: "0101010101010101010101010101010101010101010101010101010101010101"
          SEQUANA_ADMIN_TOKEN: 0123456789abcdef0123456789abcdef
          SEQUANA_WORKERS: 1
        run: |
          set -e
          cargo run --quiet > /tmp/sequana.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:8080/health

          auth=(-H "Authorization: Bearer $SEQUANA_ADMIN_TOKEN" -H "x-tenant-id: 00000000-0000-0000-0000-000000000001" -H "Content-Type: application/json")

          created=$(curl --fail --silent "${auth[@]}" \
            -X POST http://localhost:8080/api/workflows \
            --data '{
              "name": "CI Smoke",
              "definition": {
                "nodes": [
                  {"id":"manual","node_type":"manual_trigger","config":{}},
                  {"id":"set","node_type":"set","config":{"values":{"valid":true},"merge_input":false}},
                  {"id":"if","node_type":"if","config":{"left":{"$from":"/valid"},"operator":"eq","right":true}},
                  {"id":"respond","node_type":"respond_to_webhook","config":{"status":200,"body":{"ok":true}}}
                ],
                "edges": [
                  {"source":"manual","target":"set"},
                  {"source":"set","target":"if"},
                  {"source":"if","target":"respond","route":"true"}
                ]
              }
            }')

          workflow_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_id"])' <<< "$created")

          result=$(curl --fail --silent "${auth[@]}" \
            -X POST "http://localhost:8080/api/workflows/$workflow_id/run/manual" \
            --data '{}')

          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["output"]["status"] == 200; assert data["output"]["body"]["ok"] is True' <<< "$result"

          python3 ../scripts/ci_webhook_smoke.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
