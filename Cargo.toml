[package]
name = "sequana"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11"
axum = "0.8"
chrono = "0.4.45"
chrono-tz = "0.10.4"
cron = "0.17.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "json", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde"] }
